name: Monitor

on:
  schedule:
    # Every 15 minutes, off the busy top of the hour. GitHub may still start late.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two at once, otherwise the same post could be sent twice.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2   # yt-dlp needs a JS runtime for YouTube
        with:
          deno-version: v2.x

      # Only Shorts need it, so a failure here just means previews instead of videos.
      - uses: FedericoCarboni/setup-ffmpeg@v3
        continue-on-error: true
        timeout-minutes: 3

      - name: Install
        id: install
        timeout-minutes: 4
        run: pip install -q -r requirements.txt

      - name: Handle hand-written posts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python -m bot.compose

      - name: Run the bot
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        # Set the PLATFORMS repository variable to change this, e.g. to "youtube".
        run: python -m bot --platforms "${{ vars.PLATFORMS || 'youtube,x' }}"

      # Runs even after an error, so posts that did go out aren't sent again.
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -q -m "Update state [skip ci]"
          git pull -q --rebase
          git push -q
